name: Build Owner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project files
        run: flutter create --org com.deuafresh --project-name deua_owner_app .

      - name: Add Internet Permission
        run: sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: deua-owner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
